<svg xmlns="http://www.w3.org/2000/svg" width="920" height="310" viewBox="0 0 920 310">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#180312"/>
      <stop offset="100%" stop-color="#2c0621"/>
    </linearGradient>

    <linearGradient id="chipBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b0620"/>
      <stop offset="100%" stop-color="#14020f"/>
    </linearGradient>

    <linearGradient id="specularWhite" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="burgundyAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ff3da9"/>
      <stop offset="100%" stop-color="#8a125c"/>
    </linearGradient>

    <filter id="shadow3D" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Section Header -->
  <text x="0" y="22" font-family="'SFMono-Regular',Consolas,monospace" font-size="11" fill="#ffffff" font-weight="600" letter-spacing="3.5">ENGINEERING TOOLKIT &amp; ARSENAL</text>
  <text x="0" y="64" font-family="Georgia,'Times New Roman',serif" font-size="36" fill="#ffffff" font-weight="normal">The Instruments I Build With.</text>
  <rect x="0" y="78" width="920" height="2" fill="url(#burgundyAccent)"/>

  <!-- Category 1: Languages (translate: 0, 104) -->
  <g transform="translate(0, 104)" filter="url(#shadow3D)">
    <rect width="215" height="180" rx="16" fill="url(#cardBg)"/>
    <rect x="0" y="0" width="215" height="180" rx="16" fill="none" stroke="url(#specularWhite)" stroke-width="1.5"/>
    <rect x="0" y="176" width="215" height="4" rx="2" fill="#4e0a37"/>

    <text x="20" y="32" font-family="'SFMono-Regular',Consolas,monospace" font-size="10" fill="#ffffff" font-weight="bold" letter-spacing="2">LANGUAGES</text>

    <!-- Chips -->
    <g transform="translate(16, 46)">
      <!-- TypeScript -->
      <rect width="88" height="30" rx="15" fill="url(#chipBg)" stroke="url(#specularWhite)" stroke-width="1" stroke-opacity="0.4"/>
      <text x="44" y="19" font-family="-apple-system,sans-serif" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">TypeScript</text>

      <!-- Python -->
      <rect x="96" width="86" height="30" rx="15" fill="url(#chipBg)" stroke="url(#specularWhite)" stroke-width="1" stroke-opacity="0.4"/>
      <text x="139" y="19" font-family="-apple-system,sans-serif" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">Python</text>

      <!-- JavaScript -->
      <rect y="38" width="88" height="30" rx="15" fill="url(#chipBg)" stroke="url(#specularWhite)" stroke-width="1" stroke-opacity="0.4"/>
      <text x="44" y="57" font-family="-apple-system,sans-serif" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">JavaScript</text>

      <!-- C++ -->
      <rect x="96" y="38" width="86" height="30" rx="15" fill="url(#chipBg)" stroke="url(#specularWhite)" stroke-width="1" stroke-opacity="0.4"/>
      <text x="139" y="57" font-family="-apple-system,sans-serif" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">C / C++</text>

      <!-- SQL -->
      <rect y="76" width="88" height="30" rx="15" fill="url(#chipBg)" stroke="url(#specularWhite)" stroke-width="1" stroke-opacity="0.4"/>
      <text x="44" y="95" font-family="-apple-system,sans-serif" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">SQL</text>

      <!-- Bash -->
      <rect x="96" y="76" width="86" height="30" rx="15" fill="url(#chipBg)" stroke="url(#specularWhite)" stroke-width="1" stroke-opacity="0.4"/>
      <text x="139" y="95" font-family="-apple-system,sans-serif" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">Bash / Zsh</text>
    </g>
  </g>

  <!-- Category 2: Frontend & 3D (translate: 235, 104) -->
  <g transform="translate(235, 104)" filter="url(#shadow3D)">
    <rect width="215" height="180" rx="16" fill="url(#cardBg)"/>
    <rect x="0" y="0" width="215" height="180" rx="16" fill="none" stroke="url(#specularWhite)" stroke-width="1.5"/>
    <rect x="0" y="176" width="215" height="4" rx="2" fill="#4e0a37"/>

    <text x="20" y="32" font-family="'SFMono-Regular',Consolas,monospace" font-size="10" fill="#ffffff" font-weight="bold" letter-spacing="2">FRONTEND &amp; 3D</text>

    <g transform="translate(16, 46)">
      <rect width="88" height="30" rx="15" fill="url(#chipBg)" stroke="url(#specularWhite)" stroke-width="1" stroke-opacity="0.4"/>
      <text x="44" y="19" font-family="-apple-system,sans-serif" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">Next.js</text>

      <rect x="96" width="86" height="30" rx="15" fill="url(#chipBg)" stroke="url(#specularWhite)" stroke-width="1" stroke-opacity="0.4"/>
      <text x="139" y="19" font-family="-apple-system,sans-serif" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">Three.js</text>

      <rect y="38" width="88" height="30" rx="15" fill="url(#chipBg)" stroke="url(#specularWhite)" stroke-width="1" stroke-opacity="0.4"/>
      <text x="44" y="57" font-family="-apple-system,sans-serif" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">React</text>

      <rect x="96" y="38" width="86" height="30" rx="15" fill="url(#chipBg)" stroke="url(#specularWhite)" stroke-width="1" stroke-opacity="0.4"/>
      <text x="139" y="57" font-family="-apple-system,sans-serif" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">WebGL</text>

      <rect y="76" width="88" height="30" rx="15" fill="url(#chipBg)" stroke="url(#specularWhite)" stroke-width="1" stroke-opacity="0.4"/>
      <text x="44" y="95" font-family="-apple-system,sans-serif" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">GLSL</text>

      <rect x="96" y="76" width="86" height="30" rx="15" fill="url(#chipBg)" stroke="url(#specularWhite)" stroke-width="1" stroke-opacity="0.4"/>
      <text x="139" y="95" font-family="-apple-system,sans-serif" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">Tailwind</text>
    </g>
  </g>

  <!-- Category 3: Backend & Cloud (translate: 470, 104) -->
  <g transform="translate(470, 104)" filter="url(#shadow3D)">
    <rect width="215" height="180" rx="16" fill="url(#cardBg)"/>
    <rect x="0" y="0" width="215" height="180" rx="16" fill="none" stroke="url(#specularWhite)" stroke-width="1.5"/>
    <rect x="0" y="176" width="215" height="4" rx="2" fill="#4e0a37"/>

    <text x="20" y="32" font-family="'SFMono-Regular',Consolas,monospace" font-size="10" fill="#ffffff" font-weight="bold" letter-spacing="2">BACKEND &amp; DATA</text>

    <g transform="translate(16, 46)">
      <rect width="88" height="30" rx="15" fill="url(#chipBg)" stroke="url(#specularWhite)" stroke-width="1" stroke-opacity="0.4"/>
      <text x="44" y="19" font-family="-apple-system,sans-serif" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">Node.js</text>

      <rect x="96" width="86" height="30" rx="15" fill="url(#chipBg)" stroke="url(#specularWhite)" stroke-width="1" stroke-opacity="0.4"/>
      <text x="139" y="19" font-family="-apple-system,sans-serif" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">PostgreSQL</text>

      <rect y="38" width="88" height="30" rx="15" fill="url(#chipBg)" stroke="url(#specularWhite)" stroke-width="1" stroke-opacity="0.4"/>
      <text x="44" y="57" font-family="-apple-system,sans-serif" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">FastAPI</text>

      <rect x="96" y="38" width="86" height="30" rx="15" fill="url(#chipBg)" stroke="url(#specularWhite)" stroke-width="1" stroke-opacity="0.4"/>
      <text x="139" y="57" font-family="-apple-system,sans-serif" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">Supabase</text>

      <rect y="76" width="88" height="30" rx="15" fill="url(#chipBg)" stroke="url(#specularWhite)" stroke-width="1" stroke-opacity="0.4"/>
      <text x="44" y="95" font-family="-apple-system,sans-serif" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">Prisma</text>

      <rect x="96" y="76" width="86" height="30" rx="15" fill="url(#chipBg)" stroke="url(#specularWhite)" stroke-width="1" stroke-opacity="0.4"/>
      <text x="139" y="95" font-family="-apple-system,sans-serif" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">Redis</text>
    </g>
  </g>

  <!-- Category 4: AI & Systems (translate: 705, 104) -->
  <g transform="translate(705, 104)" filter="url(#shadow3D)">
    <rect width="215" height="180" rx="16" fill="url(#cardBg)"/>
    <rect x="0" y="0" width="215" height="180" rx="16" fill="none" stroke="url(#specularWhite)" stroke-width="1.5"/>
    <rect x="0" y="176" width="215" height="4" rx="2" fill="#4e0a37"/>

    <text x="20" y="32" font-family="'SFMono-Regular',Consolas,monospace" font-size="10" fill="#ffffff" font-weight="bold" letter-spacing="2">AI &amp; ARCHITECTURE</text>

    <g transform="translate(16, 46)">
      <rect width="88" height="30" rx="15" fill="url(#chipBg)" stroke="url(#specularWhite)" stroke-width="1" stroke-opacity="0.4"/>
      <text x="44" y="19" font-family="-apple-system,sans-serif" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">PyTorch</text>

      <rect x="96" width="86" height="30" rx="15" fill="url(#chipBg)" stroke="url(#specularWhite)" stroke-width="1" stroke-opacity="0.4"/>
      <text x="139" y="19" font-family="-apple-system,sans-serif" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">TF.js</text>

      <rect y="38" width="88" height="30" rx="15" fill="url(#chipBg)" stroke="url(#specularWhite)" stroke-width="1" stroke-opacity="0.4"/>
      <text x="44" y="57" font-family="-apple-system,sans-serif" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">OpenCV</text>

      <rect x="96" y="38" width="86" height="30" rx="15" fill="url(#chipBg)" stroke="url(#specularWhite)" stroke-width="1" stroke-opacity="0.4"/>
      <text x="139" y="57" font-family="-apple-system,sans-serif" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">MediaPipe</text>

      <rect y="76" width="88" height="30" rx="15" fill="url(#chipBg)" stroke="url(#specularWhite)" stroke-width="1" stroke-opacity="0.4"/>
      <text x="44" y="95" font-family="-apple-system,sans-serif" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">Docker</text>

      <rect x="96" y="76" width="86" height="30" rx="15" fill="url(#chipBg)" stroke="url(#specularWhite)" stroke-width="1" stroke-opacity="0.4"/>
      <text x="139" y="95" font-family="-apple-system,sans-serif" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">Git CI/CD</text>
    </g>
  </g>
</svg>
