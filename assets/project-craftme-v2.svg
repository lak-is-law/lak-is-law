<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p-cm-t">
  <title id="p-cm-t">Craftme: Interactive 3D Minecraft Voxel World Portfolio.</title>
  <defs>
    <linearGradient id="pcm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/>
    </linearGradient>
    <radialGradient id="pcm-glow" cx="82%" cy="35%" r="60%">
      <stop offset="0" stop-color="#701A3D" stop-opacity=".7"/><stop offset="1" stop-color="#451126" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pcm-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#C77B9B" stroke-opacity=".07"/>
    </pattern>
    <clipPath id="pcm-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="pcm-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F0F3"/><stop offset=".45" stop-color="#E5B5C7"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .pcm-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .pcm-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .pcm-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .pcm-in { animation: pcm-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .pcm-d1 { animation-delay: .15s; } .pcm-d2 { animation-delay: .4s; }
    .pcm-chip { animation: pcm-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes pcm-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .pcm-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: pcm-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes pcm-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes pcm-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .pcm-in, .pcm-chip { animation: none; } .pcm-draw { animation: none; stroke-dashoffset: 0; } }
    .pcm-trace { stroke-dasharray: 564 3136; stroke-dashoffset: 3700; animation: pcm-trace 7s linear -4s infinite; }
    @keyframes pcm-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .pcm-trace { display: none; } }
  </style>
  <g clip-path="url(#pcm-clip)">
    <rect width="1200" height="370" fill="url(#pcm-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#pcm-grid)"/>
    <rect width="1200" height="370" fill="url(#pcm-glow)"/>

    <g class="pcm-in pcm-d1">
      <text class="pcm-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#C77B9B">03 · INTERACTIVE 3D · VOXEL ENGINE · 2026</text>
      <text class="pcm-serif" x="54" y="126" font-size="52" font-weight="300" letter-spacing="-1.5" fill="#F8F0F3">Craftme<tspan font-size="28" font-style="italic" fill="#E5B5C7"> · 3D Voxel World</tspan></text>
      <text class="pcm-sans" x="56" y="166" font-size="17" fill="#B6A3AC">Interactive 3D Minecraft voxel world portfolio with RTX shader aesthetic &amp; dog Roger.</text>
      <text class="pcm-mono" x="56" y="200" font-size="12.5" fill="#E5B5C7"><tspan fill="#C77B9B">BUILT ›</tspan> Three.js voxel engine + custom shaders + procedural terrain at 60 FPS</text>
      <line class="pcm-draw" x1="56" y1="226" x2="680" y2="226" stroke="#C77B9B" stroke-opacity=".3"/>
      
      <g transform="translate(56 266)">
        <text class="pcm-serif" font-size="34" font-weight="300" fill="#F8F0F3">1,000+</text>
        <text class="pcm-sans" y="24" font-size="12.5" fill="#B6A3AC">voxels rendered live</text>
      </g>
      <g transform="translate(261 266)">
        <text class="pcm-serif" font-size="34" font-weight="300" fill="#F8F0F3">60 FPS</text>
        <text class="pcm-sans" y="24" font-size="12.5" fill="#B6A3AC">WebGL performance</text>
      </g>
      <g transform="translate(466 266)">
        <text class="pcm-serif" font-size="34" font-weight="300" fill="#F8F0F3">&lt;1.0s</text>
        <text class="pcm-sans" y="24" font-size="12.5" fill="#B6A3AC">instant world boot</text>
      </g>

      <g class="pcm-chip" style="animation-delay:1.00s"><rect x="56" y="314" width="70" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="pcm-mono" x="91" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Three.js</text></g>
      <g class="pcm-chip" style="animation-delay:1.12s"><rect x="134" y="314" width="86" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="pcm-mono" x="177" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">TypeScript</text></g>
      <g class="pcm-chip" style="animation-delay:1.24s"><rect x="228" y="314" width="50" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="pcm-mono" x="253" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Vite</text></g>
      <g class="pcm-chip" style="animation-delay:1.36s"><rect x="286" y="314" width="58" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="pcm-mono" x="315" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">WebGL</text></g>
      <g class="pcm-chip" style="animation-delay:1.48s"><rect x="352" y="314" width="92" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="pcm-mono" x="398" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">3D Voxels</text></g>
    </g>

    <!-- Isometric Voxel Cube Graphic -->
    <g class="pcm-in pcm-d2"><g transform="translate(0 35)">
      <g transform="translate(890 55)">
        <!-- Voxel Isometric Block Layer 1 -->
        <!-- Center Big Cube -->
        <g transform="translate(80 40)">
          <!-- Top face -->
          <polygon points="0,-35 45,-12 0,10 -45,-12" fill="#701A3D" stroke="#E5B5C7" stroke-width="1.2"/>
          <!-- Right face -->
          <polygon points="45,-12 45,40 0,62 0,10" fill="#331223" stroke="#C77B9B" stroke-width="1"/>
          <!-- Left face -->
          <polygon points="-45,-12 0,10 0,62 -45,40" fill="#4A1730" stroke="#C77B9B" stroke-width="1"/>
          <!-- Inner highlight -->
          <polyline points="0,10 0,62" stroke="#E5B5C7" stroke-opacity=".4" stroke-width="1"/>
        </g>

        <!-- Secondary Right Voxel -->
        <g transform="translate(135 75)">
          <polygon points="0,-25 32,-9 0,7 -32,-9" fill="#8B234D" stroke="#E5B5C7" stroke-width="1"/>
          <polygon points="32,-9 32,28 0,44 0,7" fill="#280E1C" stroke="#C77B9B" stroke-width="0.8"/>
          <polygon points="-32,-9 0,7 0,44 -32,28" fill="#3D1528" stroke="#C77B9B" stroke-width="0.8"/>
        </g>

        <!-- Tertiary Left Voxel -->
        <g transform="translate(25 75)">
          <polygon points="0,-25 32,-9 0,7 -32,-9" fill="#A12C5B" stroke="#E5B5C7" stroke-width="1"/>
          <polygon points="32,-9 32,28 0,44 0,7" fill="#280E1C" stroke="#C77B9B" stroke-width="0.8"/>
          <polygon points="-32,-9 0,7 0,44 -32,28" fill="#5A1C39" stroke="#C77B9B" stroke-width="0.8"/>
        </g>

        <!-- Top Small Crown Voxel -->
        <g transform="translate(80 -10)">
          <polygon points="0,-20 26,-7 0,6 -26,-7" fill="#E5B5C7" stroke="#FFFFFF" stroke-width="1"/>
          <polygon points="26,-7 26,22 0,35 0,6" fill="#701A3D" stroke="#E5B5C7" stroke-width="0.8"/>
          <polygon points="-26,-7 0,6 0,35 -26,22" fill="#8B234D" stroke="#E5B5C7" stroke-width="0.8"/>
        </g>
      </g>

      <g transform="translate(1005 240)">
        <rect width="138" height="44" rx="8" fill="#190B12" stroke="#C77B9B" stroke-opacity=".3"/>
        <text class="pcm-mono" x="12" y="18" font-size="10" letter-spacing="1.5" fill="#C77B9B">WEBGL ENGINE</text>
        <text class="pcm-mono" x="12" y="34" font-size="11" fill="#F8F0F3">60 FPS Voxels</text>
      </g>
    </g></g>

    <!-- Border & Laser Tracer -->
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#C77B9B" stroke-opacity=".22"/>
    <rect class="pcm-trace" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#pcm-trace)" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>