<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-labelledby="gl-t">
  <title id="gl-t">GitHub at a glance: 3,871 contributions, 14 PRs, 13-day streak.</title>
  <defs>
    <linearGradient id="gl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/>
    </linearGradient>
    <radialGradient id="gl-glow" cx="80%" cy="30%" r="70%">
      <stop offset="0" stop-color="#701A3D" stop-opacity=".6"/><stop offset="1" stop-color="#451126" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gl-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F0F3"/><stop offset=".45" stop-color="#E5B5C7"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .gl-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .gl-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .gl-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .gl-trace { stroke-dasharray: 480 2400; stroke-dashoffset: 2880; animation: gl-trace 7s linear infinite; }
    @keyframes gl-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .gl-trace { display: none; } }
  </style>

  <!-- Card Background -->
  <rect width="1200" height="240" rx="18" fill="url(#gl-bg)"/>
  <rect width="1200" height="240" rx="18" fill="url(#gl-glow)"/>
  <rect x=".5" y=".5" width="1199" height="239" rx="17.5" fill="none" stroke="#C77B9B" stroke-opacity=".2"/>
  <rect class="gl-trace" x=".5" y=".5" width="1199" height="239" rx="17.5" fill="none" stroke="url(#gl-trace)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Top Eyebrow & Title -->
  <g>
    <text class="gl-mono" x="48" y="44" font-size="11" letter-spacing="2.4" fill="#C77B9B">CODEBASE TELEMETRY · GITHUB AT A GLANCE</text>
    <text class="gl-serif" x="48" y="78" font-size="26" font-weight="300" fill="#F8F0F3">Verified contributions &amp; language architecture.</text>
    <line x1="48" y1="104" x2="1152" y2="104" stroke="#C77B9B" stroke-opacity=".18"/>
  </g>

  <!-- Metrics Grid -->
  <g>
    <!-- Metric 1: Total Contributions -->
    <g>
      <text class="gl-mono" x="48" y="138" font-size="10" letter-spacing="1.8" fill="#C77B9B">TOTAL CONTRIBUTIONS</text>
      <text class="gl-serif" x="48" y="174" font-size="34" font-weight="300" fill="#F8F0F3">3,871</text>
      <text class="gl-sans" x="48" y="196" font-size="12" fill="#B6A3AC">2023–2026 indexed</text>
    </g>

    <!-- Metric 2: This Year -->
    <g>
      <text class="gl-mono" x="210" y="138" font-size="10" letter-spacing="1.8" fill="#C77B9B">THIS YEAR</text>
      <text class="gl-serif" x="210" y="174" font-size="34" font-weight="300" fill="#F8F0F3">1,286</text>
      <text class="gl-sans" x="210" y="196" font-size="12" fill="#B6A3AC">200 active days</text>
    </g>

    <!-- Metric 3: Longest Streak -->
    <g>
      <text class="gl-mono" x="355" y="138" font-size="10" letter-spacing="1.8" fill="#C77B9B">LONGEST STREAK</text>
      <text class="gl-serif" x="355" y="174" font-size="34" font-weight="300" fill="#F8F0F3">13 Days</text>
      <text class="gl-sans" x="355" y="196" font-size="12" fill="#B6A3AC">Mar 2026 sprint</text>
    </g>

    <!-- Metric 4: Pull Requests -->
    <g>
      <text class="gl-mono" x="500" y="138" font-size="10" letter-spacing="1.8" fill="#C77B9B">PULL REQUESTS</text>
      <text class="gl-serif" x="500" y="174" font-size="34" font-weight="300" fill="#F8F0F3">14</text>
      <text class="gl-sans" x="500" y="196" font-size="12" fill="#B6A3AC">merged &amp; shipped</text>
    </g>

    <!-- Vertical separator line -->
    <line x1="635" y1="124" x2="635" y2="202" stroke="#C77B9B" stroke-opacity=".22"/>

    <!-- Languages Stack -->
    <g>
      <text class="gl-mono" x="665" y="138" font-size="10" letter-spacing="1.8" fill="#C77B9B">DOMINANT LANGUAGES &amp; STACK</text>
      
      <!-- Multi-segment progress bar -->
      <g transform="translate(665 152)">
        <rect width="485" height="10" rx="5" fill="#27101C"/>
        <rect width="204" height="10" rx="5" fill="#E5B5C7"/>
        <rect x="207" width="136" height="10" rx="5" fill="#C77B9B"/>
        <rect x="345" width="87" height="10" rx="5" fill="#701A3D"/>
        <rect x="434" width="51" height="10" rx="5" fill="#C9A27A"/>
      </g>

      <!-- Language Legend Items -->
      <g transform="translate(665 190)">
        <circle cx="5" cy="-4" r="4" fill="#E5B5C7"/>
        <text class="gl-mono" x="15" font-size="11" fill="#F8F0F3">TypeScript <tspan fill="#B6A3AC">42%</tspan></text>

        <circle cx="140" cy="-4" r="4" fill="#C77B9B"/>
        <text class="gl-mono" x="150" font-size="11" fill="#F8F0F3">Python <tspan fill="#B6A3AC">28%</tspan></text>

        <circle cx="250" cy="-4" r="4" fill="#701A3D"/>
        <text class="gl-mono" x="260" font-size="11" fill="#F8F0F3">GLSL/3D <tspan fill="#B6A3AC">18%</tspan></text>

        <circle cx="370" cy="-4" r="4" fill="#C9A27A"/>
        <text class="gl-mono" x="380" font-size="11" fill="#F8F0F3">Other <tspan fill="#B6A3AC">12%</tspan></text>
      </g>
    </g>
  </g>
</svg>
